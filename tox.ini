[tox]
envlist = py311, py312, py13, py314
# https://tox.readthedocs.io/en/latest/config.html#conf-requires
# Ensure pip is new enough
requires = pip >= 19.0.0
           virtualenv >= 16.0.0

[testenv]
# For environment markers see
# https://www.python.org/dev/peps/pep-0508/#environment-markers
allowlist_externals = sh
deps =
    flake8
    omero-py
    pytest-rerunfailures
    pytest-xdist
    restructuredtext-lint
    setuptools
    wheel
    build
    https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20261109/zeroc_ice-3.6.5-cp311-cp311-manylinux_2_28_x86_64.whl; platform_system=="Linux" and python_version=="3.11"
    https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20261109/zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_x86_64.whl; platform_system=="Linux" and python_version=="3.12"
    https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20261109/zeroc_ice-3.6.5-cp313-cp313-manylinux_2_28_x86_64.whl; platform_system=="Linux" and python_version=="3.13"
    https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/20261109/zeroc_ice-3.6.5-cp314-cp314-manylinux_2_28_x86_64.whl; platform_system=="Linux" and python_version=="3.14"
    https://github.com/glencoesoftware/zeroc-ice-py-macos-universal2/releases/download/20261011/zeroc_ice-3.6.5-cp311-cp311-macosx_11_0_universal2.whl; platform_system!="Windows" and platform_system!="Linux" and python_version=="3.11"
    https://github.com/glencoesoftware/zeroc-ice-py-macos-universal2/releases/download/20261011/zeroc_ice-3.6.5-cp312-cp312-macosx_11_0_universal2.whl; platform_system!="Windows" and platform_system!="Linux" and python_version=="3.12"
    https://github.com/glencoesoftware/zeroc-ice-py-macos-universal2/releases/download/20261011/zeroc_ice-3.6.5-cp313-cp313-macosx_11_0_universal2.whl; platform_system!="Windows" and platform_system!="Linux" and python_version=="3.13"
    https://github.com/glencoesoftware/zeroc-ice-py-macos-universal2/releases/download/20261011/zeroc_ice-3.6.5-cp314-cp314-macosx_11_0_universal2.whl; platform_system!="Windows" and platform_system!="Linux" and python_version=="3.14"
commands =
    rst-lint README.rst
    flake8 .
    python -c 'import omero.clients; import omero_marshal.encode'
    pytest {posargs:-n4 -rf tests -s}
    sh -c 'cat files.txt | xargs rm -rf'
    python -m build
    sh -c 'pip install --force-reinstall dist/*.whl'
    python -c 'import omero.clients; import omero_marshal.encode'
